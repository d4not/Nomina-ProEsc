<div class="card">
  <div class="card-header">
    <h5 style="background-color:rgb(248, 1, 1);color:aliceblue;">Catalogo De puestos</h5> 
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Id puesto</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="idDepartamento" [(ngModel)]="idDepartamento">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Descripcion</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Descripcion" [(ngModel)]="descripcion">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Id departamento</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="idUnidad" [(ngModel)]="idUnidad">
    </div>
    <div class="mt-3">
      <button type="button" class="btn btn-primary me-2" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn btn-success me-2">Grabar</button>
      <button type="button" class="btn btn-danger me-2">Eliminar</button>
      <button type="button" class="btn btn-warning">Modificar</button>
    </div>
  </div>
</div>

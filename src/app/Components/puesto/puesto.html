<div class="card">
  <div class="card-header">
    <h5 style="color:#be185d;">Catalogo De puestos</h5> 
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="idPuesto" class="form-label">Id puesto</label>
      <input type="text" class="form-control" id="idPuesto" placeholder="idPuesto" [(ngModel)]="idPuesto">
    </div>
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripcion</label>
      <input type="text" class="form-control" id="descripcion" placeholder="Descripcion" [(ngModel)]="descripcion">
    </div>
    <div class="mb-3">
      <label for="idDepartamento" class="form-label">Id departamento</label>
      <input type="text" class="form-control" id="idDepartamento" placeholder="idDepartamento" [(ngModel)]="idDepartamento">
    </div>
    <div class="mt-3">
      <button type="button" class="btn btn-primary me-2" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn btn-success me-2" (click)="Grabar()">Grabar</button>
      <button type="button" class="btn btn-danger me-2" (click)="Eliminar()">Eliminar</button>
      <button type="button" class="btn btn-warning" (click)="Modificar()">Modificar</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <h5 style="color:#0f766e;">Catalogo de empleados</h5> 
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="idEmpleado" class="form-label">Id</label>
      <input type="text" class="form-control" id="idEmpleado" placeholder="id Empleado" [(ngModel)]="idEmpleado">
    </div>
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" placeholder="Nombre" [(ngModel)]="nombre">
    </div>
     <div class="mb-3">
      <label for="apellidos" class="form-label">Apellidos</label>
      <input type="text" class="form-control" id="apellidos" placeholder="Apellidos" [(ngModel)]="apellidos">
    </div>
    <div class="mb-3">
      <label for="direccion" class="form-label">Direccion</label>
      <input type="text" class="form-control" id="direccion" placeholder="Direccion" [(ngModel)]="direccion">
    </div>
    <div class="mb-3">
      <label for="rfc" class="form-label">RFC</label>
      <input type="text" class="form-control" id="rfc" placeholder="RFC" [(ngModel)]="rfc">
    </div>
    <div class="mb-3">
      <label for="cp" class="form-label">CP</label>
      <input type="text" class="form-control" id="cp" placeholder="CP" [(ngModel)]="cp">
    </div>
    <div class="mt-3">
      <button type="button" class="btn btn-primary me-2" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn btn-success me-2" (click)="Grabar()">Grabar</button>
      <button type="button" class="btn btn-danger me-2" (click)="Eliminar()">Eliminar</button>
      <button type="button" class="btn btn-warning" (click)="Modificar()">Modificar</button>
    </div>
  </div>
</div>

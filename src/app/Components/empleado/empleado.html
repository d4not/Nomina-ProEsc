<div class="card">
  <div class="card-header">
    <h5 style="background-color:blueviolet;color:aliceblue;">Catalogo de empleados</h5> 
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Id</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="id Empleado" [(ngModel)]="idEmpleado">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Nombre" [(ngModel)]="nombre">
    </div>
     <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Apellidos</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Apellidos" [(ngModel)]="apellidos">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Direccion</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Direccion" [(ngModel)]="direccion">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">RFC</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="RFC" [(ngModel)]="rfc">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">CP</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="CP" [(ngModel)]="cp">
    </div>
    <div class="mt-3">
      <button type="button" class="btn btn-primary me-2" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn btn-success me-2">Grabar</button>
      <button type="button" class="btn btn-danger me-2">Eliminar</button>
      <button type="button" class="btn btn-warning">Modificar</button>
    </div>
  </div>
</div>

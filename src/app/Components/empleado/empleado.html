<div class="contenedor">
  <div class="card catalogo">
    <div class="card-header catalogo__header">
      <span class="catalogo__icono">EM</span>
      <div>
        <h5 class="catalogo__titulo">Catálogo de Empleados</h5>
        <p class="catalogo__subtitulo">Datos generales de cada empleado</p>
      </div>
    </div>
    <div class="card-body catalogo__body">
      <div class="mb-3 campo campo--id">
        <label for="idEmpleado" class="form-label">Id Empleado</label>
        <input type="text" class="form-control" id="idEmpleado" placeholder="Id Empleado" [(ngModel)]="idEmpleado">
      </div>
      <div class="mb-3 campo">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Nombre" [(ngModel)]="nombre">
      </div>
      <div class="mb-3 campo">
        <label for="apellidos" class="form-label">Apellidos</label>
        <input type="text" class="form-control" id="apellidos" placeholder="Apellidos" [(ngModel)]="apellidos">
      </div>
      <div class="mb-3 campo">
        <label for="direccion" class="form-label">Dirección</label>
        <input type="text" class="form-control" id="direccion" placeholder="Dirección" [(ngModel)]="direccion">
      </div>
      <div class="mb-3 campo">
        <label for="rfc" class="form-label">RFC</label>
        <input type="text" class="form-control" id="rfc" placeholder="RFC" [(ngModel)]="rfc">
      </div>
      <div class="mb-3 campo">
        <label for="cp" class="form-label">Código postal</label>
        <input type="text" class="form-control" id="cp" placeholder="Código postal" [(ngModel)]="cp">
      </div>
    </div>
    <div class="card-footer catalogo__acciones">
      <button type="button" class="btn boton boton--consultar" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn boton boton--grabar" (click)="Grabar()">Grabar</button>
      <button type="button" class="btn boton boton--modificar" (click)="Modificar()">Modificar</button>
      <button type="button" class="btn boton boton--eliminar" (click)="Eliminar()">Eliminar</button>
    </div>
  </div>
</div>

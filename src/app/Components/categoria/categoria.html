<div class="contenedor">
  <div class="card catalogo">
    <div class="card-header catalogo__header">
      <span class="catalogo__icono">CA</span>
      <div>
        <h5 class="catalogo__titulo">Catálogo de Categorías</h5>
        <p class="catalogo__subtitulo">Categorías de sueldo y su nivel</p>
      </div>
    </div>
    <div class="card-body catalogo__body">
      <div class="mb-3 campo campo--id">
        <label for="idCategoria" class="form-label">Id Categoría</label>
        <input type="text" class="form-control" id="idCategoria" placeholder="Id Categoría" [(ngModel)]="idCategoria">
      </div>
      <div class="mb-3 campo">
        <label for="descripcion" class="form-label">Descripción</label>
        <input type="text" class="form-control" id="descripcion" placeholder="Descripción" [(ngModel)]="descripcion">
      </div>
      <div class="mb-3 campo">
        <label for="sueldo" class="form-label">Sueldo</label>
        <input type="text" class="form-control" id="sueldo" placeholder="Sueldo" [(ngModel)]="sueldo">
      </div>
      <div class="mb-3 campo">
        <label for="idNivel" class="form-label">Id Nivel</label>
        <input type="text" class="form-control" id="idNivel" placeholder="Id Nivel" [(ngModel)]="idNivel">
      </div>
    </div>
    <div class="card-footer catalogo__acciones">
      <button type="button" class="btn boton boton--consultar" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn boton boton--grabar" (click)="Grabar()">Grabar</button>
      <button type="button" class="btn boton boton--modificar" (click)="Modificar()">Modificar</button>
      <button type="button" class="btn boton boton--eliminar" (click)="Eliminar()">Eliminar</button>
    </div>
  </div>
</div>

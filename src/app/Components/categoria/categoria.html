<div class="card">
  <div class="card-header">
    <h5 style="background-color:rgb(0, 40, 219);color:aliceblue;">Catalogo De Categoria</h5> 
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Id Categoria</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="idCategoria" [(ngModel)]="idCategoria">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Descripcion</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Descripcion" [(ngModel)]="descripcion">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">Sueldo</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Sueldo" [(ngModel)]="sueldo">
    </div>
    <div class="mb-3">
      <label for="exampleFormControlInput1" class="form-label">id Nivel</label>
      <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="idNivel" [(ngModel)]="idNivel">
    </div>
    <div class="mt-3">
      <button type="button" class="btn btn-primary me-2" (click)="Consultar()">Consultar</button>
      <button type="button" class="btn btn-success me-2"(click)="Grabar()">Grabar</button>
      <button type="button" class="btn btn-danger me-2"(click)="Eliminar()">Eliminar</button>
      <button type="button" class="btn btn-warning"(click)="Modificar()">Modificar</button>
    </div>
  </div>
</div>
